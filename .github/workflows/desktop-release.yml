name: Desktop release
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux UI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Match tag to desktop version
        shell: bash
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('crates/ringdesign-gui/Cargo.toml', 'rb'))['package']['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'desktop-v{version}', 'Tag must match the desktop Cargo version'
          PY
      - run: cargo test -p ringdesign-gui --locked
      - run: cargo build -p ringdesign-gui --release --locked --target ${{ matrix.target }}
      - name: Package executable and checksum
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_SUFFIX: ${{ matrix.suffix }}
        run: |
          python - <<'PY'
          import os, pathlib, shutil, hashlib
          target, suffix = os.environ['RELEASE_TARGET'], os.environ['RELEASE_SUFFIX']
          out = pathlib.Path('dist'); out.mkdir()
          artifact = out / f'ringdesigner-{target}{suffix}'
          shutil.copy2(f'target/{target}/release/ringdesigner{suffix}', artifact)
          artifact.with_name(artifact.name + '.sha256').write_text(hashlib.sha256(artifact.read_bytes()).hexdigest() + '  ' + artifact.name + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - name: Publish verified desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "RingDesigner $RELEASE_TAG" --generate-notes
