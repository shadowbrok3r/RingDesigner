# A static CRT means the shipped .exe needs no Visual C++ runtime installed:
# one file is the whole program, which is the point of the bundle.
#
# Nothing for Linux here on purpose. A linker preference is per-machine — put
# clang/mold in ~/.cargo/config.toml, where it applies to every project and
# cannot reach a CI runner or the portable-build container.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-Awarnings"]
