[package]
name = "egui-mobile-theme"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared Mastertech palette and desktop/touch metrics for egui applications"

[dependencies]
egui = { version = "0.37.0", features = ["serde", "experimental"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
