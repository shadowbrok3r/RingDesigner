[package]
name = "ringdesign-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["parallel"]
## Rayon across the sweep, refinement and analysis. Off, everything runs
## serial — the wasm story, where threads need a whole worker setup.
parallel = ["dep:rayon"]

[dependencies]
ringdesign-assets.workspace = true
nalgebra.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
rayon = { workspace = true, optional = true }
image.workspace = true
parking_lot.workspace = true
base64 = "0.22"
fontdue = "0.9"
resvg = { version = "0.48.1", default-features = false }
cadkernel = { git = "https://github.com/HakanSeven12/cadkernel.git", rev = "920ff591028ab4ba13648b920d9d333ec3b7d44b", default-features = false, features = ["brep", "offset"] }
roxmltree = "0.21"
robust = "1.2"
spade = "2.15"
svgtypes = "0.16"
