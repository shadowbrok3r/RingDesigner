[package]
name = "ringdesign-workbench"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
glow = ["dep:egui_glow"]

[dependencies]
ringdesign-assets.workspace = true
ringdesign-core = { path = "../ringdesign-core", default-features = false }
ringdesign-graph = { path = "../ringdesign-graph", default-features = false }
ringdesign-script = { path = "../ringdesign-script", default-features = false }
egui.workspace = true
egui_glow = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
image.workspace = true
resvg = { version = "0.48.1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Worker", "MessageEvent", "ErrorEvent"] }
