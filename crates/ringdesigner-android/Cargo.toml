[package]
name = "ringdesigner_android"
# Its own, not the workspace's: the Android versionCode derives from it as
# (1<<24)|(major<<16)|(minor<<8)|patch, and the phone only installs a strictly greater one.
version = "0.10.0"
edition.workspace = true
license.workspace = true
publish = false

# rlib as well as cdylib so the pure modules stay host-testable with `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# On-device Qualcomm HTP NPU: CLIP for library search, SD 1.5 for pattern generation.
# Off by default and nothing in a default build links a `local-*` crate — the QNN runtime libs are
# proprietary and staged per machine (EguiMobile's scripts/qnn-stage-libs.sh), so a half-enabled
# build would ship an APK whose NPU features fail with nothing readable on screen.
# Build with `cargo ndk ... --features local-npu`.
local-npu = ["dep:local-clip", "dep:local-sd"]

[dependencies]
# The Android framework: https://github.com/shadowbrok3r/ios-egui (checked out at
# ~/Documents/Rust/Mobile/EguiMobile). It, the local-* model crates and backdrop-blur-egui come
# from that one git source; the root [patch.crates-io] repins its android-activity fork, which a
# git dependency does not bring along.
egui-mobile = { git = "https://github.com/shadowbrok3r/ios-egui" }
egui.workspace = true
# Direct, not via egui-mobile, which does not re-export it. Must be the same 0.36 egui_glow the
# runtime uses: two copies in the graph make the paint callback's downcast fail, and the only
# symptom is a blank viewport and one `Unsupported render callback` warning.
egui_glow.workspace = true
log.workspace = true
# Prefs are a plain serde struct; core already pulls serde in, this makes the derive reachable.
serde.workspace = true
serde_json.workspace = true
# Plain HTTP to the desktop over Tailscale; no TLS on purpose, the tailnet is the boundary.
minreq = "3"
# On-device models, behind `local-npu`. Their device paths compile on the host and only fail at
# runtime without an NPU, so they need no target gate — the feature is the gate.
local-clip = { git = "https://github.com/shadowbrok3r/ios-egui", optional = true }
local-sd = { git = "https://github.com/shadowbrok3r/ios-egui", optional = true }
# The geometry, unchanged.
ringdesign-core.workspace = true
# The recipe graph: runtime, the snarl editor (on the root's egui-snarl patch), and the rhai nodes.
ringdesign-graph.workspace = true
ringdesign-graph-ui.workspace = true
ringdesign-script.workspace = true

# cargo-apk2 reads this to generate the APK manifest.
[package.metadata.android]
package = "com.kingsofalchemy.ringdesigner"
# egui-android's Java bridge: a copy of the framework's crates/egui-android/java, re-synced from
# the resolved egui-android by every `cargo egui-mobile build`/`run` — edit it there, not here.
java_sources = "java"
# Launcher icon mipmaps, rendered from icon/ic_launcher.svg by this crate's scripts/render-icons.sh.
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

# The shared debug keystore every app in this repo signs with — a different key makes
# future updates fail INSTALL_FAILED_UPDATE_INCOMPATIBLE.
[package.metadata.android.signing.release]
path = "/home/shadowbroker/.android/debug.keystore"
keystore_password = "android"

[package.metadata.android.application]
label = "RingDesigner"
icon = "@mipmap/ic_launcher"
has_code = true

# Without this stanza cargo-apk2 emits no launcher activity: the APK installs and
# reports as present, but has no home-screen entry.
[[package.metadata.android.application.activity]]
name = "com.github.egui_mobile.EguiNativeActivity"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|density"
window_soft_input_mode = "adjustResize"
[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "ringdesigner_android"
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

# Read the gallery so a photograph of a real surface can become an alpha. Images only — there is
# no video source here.
# Reaching the desktop's sync endpoint over the tailnet.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"
# Android 14+ hands out a partial "Select photos" grant instead of a full one; an app targeting 34+
# that asks for READ_MEDIA_IMAGES must declare this too or the partial choice reads as a denial.
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_VISUAL_USER_SELECTED"
# Pre-Android-13 devices, where the scoped permissions do not exist.
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32
[[package.metadata.android.uses_permission]]
name = "android.permission.VIBRATE"


[target.'cfg(target_os = "android")'.dependencies]
# The framework repo's egui-0.36 fork of backdrop-blur (its patches/backdrop-blur); glow only.
backdrop-blur-egui = { git = "https://github.com/shadowbrok3r/ios-egui", default-features = false, features = ["grab-pass"] }
