[package]
name = "ringdesign-graph"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Dataflow graphs that evaluate to RingDesigner designs, with implicit-list semantics"

[features]
default = ["parallel"]
## Forwarded to the core: threads across builds the graph's sinks run. Off
## for wasm, where the whole crate stays pure Rust.
parallel = ["ringdesign-core/parallel"]

[dependencies]
ringdesign-core = { path = "../ringdesign-core", default-features = false }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
