[package]
name = "ringdesign-configurator"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "build-a-ring"
path = "src/main.rs"

[features]
default = ["parallel"]
## Threads across the build; off for wasm, where the worker becomes the
## remaining porting task (std::thread does not run in a browser).
parallel = ["ringdesign-core/parallel"]

[dependencies]
ringdesign-core = { path = "../ringdesign-core", default-features = false }
eframe.workspace = true
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
