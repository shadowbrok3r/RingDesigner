[workspace]
resolver = "3"
members = [
    "crates/ringdesign-assets",
    "crates/ringdesign-core",
    "crates/ringdesign-gui",
    "crates/ringdesign-mcp",
    "crates/ringdesign-mcpd",
    "crates/ringdesign-configurator",
    "crates/ringdesign-workbench",
    "crates/ringdesign-graph",
    "crates/ringdesign-graph-ui",
    "crates/ringdesign-script",
    "crates/ringdesign-cli",
    "crates/ringdesign-py",
    "crates/ringdesign-solid",
    "crates/ringdesign-occt",
    # The phone app; builds on egui-mobile from the EguiMobile repo as a git dependency.
    "crates/ringdesigner-android",
]
# Vendored forks are reached through [patch.crates-io], not built as members.
exclude = ["vendor/egui-mobile-theme", "patches/egui-snarl", "patches/egui-scale", "patches/egui", "patches/egui_tiles"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
egui-mobile-theme = { path = "vendor/egui-mobile-theme" }
ringdesign-assets = { path = "crates/ringdesign-assets" }
ringdesign-core = { path = "crates/ringdesign-core" }
ringdesign-mcp = { path = "crates/ringdesign-mcp" }
ringdesign-graph = { path = "crates/ringdesign-graph" }
ringdesign-graph-ui = { path = "crates/ringdesign-graph-ui" }
ringdesign-script = { path = "crates/ringdesign-script" }
ringdesign-solid = { path = "crates/ringdesign-solid" }
rhai = { version = "1.25", features = ["sync", "serde"] }

nalgebra = "0.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
anyhow = "1.0.104"
log = "0.4.33"
rayon = "1.12"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
parking_lot = "0.12"
schemars = "1.2"

rmcp = { version = "3.1.2", features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
    "transport-streamable-http-server",
] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "net", "io-std", "time"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server-auto", "service"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }

eframe = { version = "0.37.0", default-features = false, features = [
    "persistence",
    "clipboard",
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
# monochrome_emoji_fonts: the emoji fonts eframe's default_fonts no longer bundles.
egui = { version = "0.37.0", features = ["rayon", "serde", "monochrome_emoji_fonts"] }
egui_glow = "0.37.0"
egui-phosphor = "0.14.0"
egui_tiles = "0.17.0"
egui-snarl = { version = "0.11.0", features = ["serde"] }
rfd = "0.17.2"
env_logger = "0.11.11"

# Windows resources: the icon, the manifest and the version block, compiled
# into the .exe by ringdesign-gui's build script.
embed-resource = "3"

# Compile-time .env loading for ringdesign-gui's build script, the same way
# the Mastertech `database` crate does it.
dotenvy = "0.15"

# Upstream egui-phosphor still pins egui 0.36; this fork tracks 0.37.
# egui-snarl, egui-scale and egui_tiles likewise, vendored under patches/ (see patches/README.md).
[patch.crates-io]
egui = { path = "patches/egui" }
egui-phosphor = { git = "https://github.com/shadowbrok3r/egui-phosphor", branch = "egui-037" }
egui-snarl = { path = "patches/egui-snarl" }
egui-scale = { path = "patches/egui-scale" }
egui_tiles = { path = "patches/egui_tiles" }
# For crates/ringdesigner-android: winit's implicit-only IME hides break egui-android's EditText
# bridge, and the framework repo's fork skips them. A git dependency never brings its own root
# [patch] table along, so the app's workspace has to carry it.
android-activity = { git = "https://github.com/shadowbrok3r/EguiMobile", rev = "af697fc24aecf917b950244c264c1e10476bfca3" }

[profile.dev]
opt-level = 1

# Mesh generation and image sampling are unusably slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
