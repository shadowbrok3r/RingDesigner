[workspace]
resolver = "3"
members = [
    "crates/ringdesign-core",
    "crates/ringdesign-gui",
    "crates/ringdesign-mcp",
    "crates/ringdesign-mcpd",
    "crates/ringdesign-configurator",
    "crates/ringdesign-graph",
    "crates/ringdesign-graph-ui",
    "crates/ringdesign-script",
    "crates/ringdesign-cli",
    "crates/ringdesign-py",
    "crates/ringdesign-solid",
    # The phone app; builds on egui-mobile from the EguiMobile repo as a git dependency.
    "crates/ringdesigner-android",
]
# Vendored forks are reached through [patch.crates-io], not built as members.
exclude = ["patches/egui-snarl", "patches/egui-scale"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ringdesign-core = { path = "crates/ringdesign-core" }
ringdesign-mcp = { path = "crates/ringdesign-mcp" }
ringdesign-graph = { path = "crates/ringdesign-graph" }
ringdesign-graph-ui = { path = "crates/ringdesign-graph-ui" }
ringdesign-script = { path = "crates/ringdesign-script" }
ringdesign-solid = { path = "crates/ringdesign-solid" }
rhai = { version = "1.25", features = ["sync", "serde"] }

nalgebra = "0.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
log = "0.4.33"
rayon = "1.12"
parking_lot = "0.12"
schemars = "1.2"

rmcp = { version = "3.1.2", features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
    "transport-streamable-http-server",
] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "net", "io-std", "time"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server-auto", "service"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }

eframe = { version = "0.36.0", default-features = false, features = [
    "persistence",
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
egui = { version = "0.36.0", features = ["rayon", "serde"] }
egui_glow = "0.36.0"
egui-phosphor = "0.12.0"
egui_tiles = "0.17.0"
egui-snarl = { version = "0.11.0", features = ["serde"] }
rfd = "0.17.2"
env_logger = "0.11.11"

# Upstream egui-phosphor still pins egui 0.35; this fork tracks 0.36.
# egui-snarl and egui-scale likewise, vendored under patches/ (see patches/README.md).
[patch.crates-io]
egui-phosphor = { git = "https://github.com/shadowbrok3r/egui-phosphor", branch = "egui-036" }
egui-snarl = { path = "patches/egui-snarl" }
egui-scale = { path = "patches/egui-scale" }
# For crates/ringdesigner-android: winit's implicit-only IME hides break egui-android's EditText
# bridge, and the framework repo's fork skips them. A git dependency never brings its own root
# [patch] table along, so the app's workspace has to carry it.
android-activity = { git = "https://github.com/shadowbrok3r/ios-egui" }

[profile.dev]
opt-level = 1

# Mesh generation and image sampling are unusably slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
