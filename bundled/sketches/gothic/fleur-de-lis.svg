  <title>fleur-de-lis</title>
  <desc>Stand-in drawn in place of Ornament 028 (fleur-de-lis) (assets/User/Profiles, git-ignored, not in this checkout); tools/harvest_gothic.py replaces it from the 3DM under this name. A fleur-de-lis: centre petal, two petals curling out, band and feet.</desc>
