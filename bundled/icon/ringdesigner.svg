<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="plate" cx="0.5" cy="0.26" r="0.92">
      <stop offset="0" stop-color="#1b1531"/>
      <stop offset="0.55" stop-color="#0d0b16"/>
      <stop offset="1" stop-color="#050409"/>
    </radialGradient>
    <linearGradient id="cope" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#cc91d9"/>
      <stop offset="1" stop-color="#e66c99"/>
    </linearGradient>
    <linearGradient id="table" x1="0.15" y1="1" x2="0.85" y2="0">
      <stop offset="0" stop-color="#e2e0ef"/>
      <stop offset="1" stop-color="#f6f4fb"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#plate)"/>
  <rect x="8.9" y="8.9" width="238.2" height="238.2" rx="55.1" fill="none" stroke="#4b4678" stroke-width="1.8" opacity="0.55"/>

  <!-- Drag: the half below the parting plane, in shadow. -->
  <path d="M58 154a70 70 0 0 0 140 0" fill="none" stroke="#584d8c" stroke-width="21" stroke-linecap="round"/>

  <!-- Cope: the half above it, and the signet head it carries. -->
  <path d="M58 154a70 70 0 0 1 140 0" fill="none" stroke="url(#cope)" stroke-width="21" stroke-linecap="round"/>
  <ellipse cx="128" cy="74" rx="61" ry="33" fill="url(#cope)"/>
  <ellipse cx="128" cy="72" rx="46" ry="22" fill="url(#table)"/>

  <!-- The mould parts here, and pulls both ways. The dark channel under the
       line keeps it legible where it crosses the band. -->
  <path d="M22 154h212" stroke="#0a0812" stroke-width="11" stroke-linecap="round"/>
  <path d="M22 154h212" stroke="#67d9d5" stroke-width="6" stroke-linecap="round"/>
</svg>
